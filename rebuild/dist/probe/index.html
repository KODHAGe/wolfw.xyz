<!DOCTYPE html><html><head><meta charset="utf-8"><title>shader probe</title></head> <body style="font: 12px ui-monospace, monospace; background:#111; color:#0f0"> <canvas id="c" width="800" height="600"></canvas> <pre id="out">running…</pre> <script type="module">
window.addEventListener("error", (e) => {
  document.getElementById("out").textContent += "\nERROR: " + (e.message || e) + " @ " + e.filename + ":" + e.lineno;
});
window.addEventListener("unhandledrejection", (e) => {
  document.getElementById("out").textContent += "\nREJECT: " + (e.reason?.message || e.reason);
});
let SHADERS, ELEMENTS;
try {
  ({ SHADERS, ELEMENTS } = await import("/src/lib/background.ts"));
  document.getElementById("out").textContent += "\nmodule loaded, keys: " + Object.keys(await import("/src/lib/background.ts")).join(",");
} catch (e) {
  document.getElementById("out").textContent += "\nIMPORT FAILED: " + e.message;
}

const out = document.getElementById("out");
const log = (...a) => { out.textContent += "\n" + a.join(" "); };

const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl2", { alpha: true, antialias: false, premultipliedAlpha: true, preserveDrawingBuffer: true });
if (!gl) { log("FAIL: no webgl2"); } else {

  const compile = (type, src) => {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      throw new Error("compile: " + gl.getShaderInfoLog(sh));
    }
    return sh;
  };

  let prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, SHADERS.vert));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, SHADERS.frag));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error("link: " + gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    log("compile+link OK");
  } catch (e) {
    log("SHADER ERROR:", e.message);
    throw e;
  }

  // Uniform locations — the [0] question.
  for (const n of ["u_resolution","u_time","u_pixelRatio","u_accent","u_alpha","u_reduced","u_p[0]","u_pos[0]"]) {
    log("  loc", n.padEnd(14), "=>", String(gl.getUniformLocation(prog, n)));
  }
  log("  loc u_p (no [0]) =>", String(gl.getUniformLocation(prog, "u_p")));

  // Upload the real parameters.
  const params = new Float32Array(56);
  ELEMENTS.forEach((e, i) => {
    const b = i*8;
    params[b+0]=e.rotation; params[b+1]=e.width; params[b+2]=e.dash;
    params[b+3]=e.freq; params[b+4]=e.amp; params[b+5]=e.grid;
    params[b+6]=e.offset; params[b+7]=e.total;
  });
  const positions = new Float32Array(14);
  ELEMENTS.forEach((e,i)=>{ positions[i*2]=e.posX; positions[i*2+1]=e.posY; });

  gl.uniform1fv(gl.getUniformLocation(prog,"u_p[0]"), params);
  gl.uniform1fv(gl.getUniformLocation(prog,"u_pos[0]"), positions);
  gl.uniform2f(gl.getUniformLocation(prog,"u_resolution"), canvas.width, canvas.height);
  gl.uniform1f(gl.getUniformLocation(prog,"u_pixelRatio"), 1);
  gl.uniform3f(gl.getUniformLocation(prog,"u_accent"), 0.08, 0.08, 0.08);
  gl.uniform1f(gl.getUniformLocation(prog,"u_alpha"), 1.0);
  gl.uniform1f(gl.getUniformLocation(prog,"u_reduced"), 0);
  gl.uniform1f(gl.getUniformLocation(prog,"u_time"), 0);

  gl.viewport(0,0,canvas.width,canvas.height);
  gl.clearColor(0,0,0,0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  log("gl error after draw:", gl.getError(), "(0 = none)");

  // Read the whole buffer and count non-transparent pixels.
  const buf = new Uint8Array(canvas.width * canvas.height * 4);
  gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, buf);

  let lit = 0, maxA = 0, maxRGB = 0;
  const hits = [];
  for (let i = 0; i < buf.length; i += 4) {
    const a = buf[i+3];
    if (a > 0) { lit++; if (hits.length < 6) hits.push([(i/4)%canvas.width, Math.floor((i/4)/canvas.width), buf[i], buf[i+1], buf[i+2], a]); }
    if (a > maxA) maxA = a;
    const m = Math.max(buf[i], buf[i+1], buf[i+2]);
    if (m > maxRGB) maxRGB = m;
  }
  log("LIT PIXELS:", lit, "of", canvas.width*canvas.height,
      "=", (100*lit/(canvas.width*canvas.height)).toFixed(2)+"%");
  log("max alpha:", maxA, " max rgb:", maxRGB);
  log("first hits [x,y,r,g,b,a]:", JSON.stringify(hits));
  log("preserveDrawingBuffer was: false by default — buffer is cleared on composite");
  // Sample a grid rather than trusting the first row.
  const samples = [];
  for (let y = 0; y < 600; y += 150) for (let x = 0; x < 800; x += 200) {
    const i = (y*800+x)*4;
    samples.push([x,y,buf[i],buf[i+1],buf[i+2],buf[i+3]]);
  }
  log("grid samples:", JSON.stringify(samples));
  // --- BISECT: force a constant colour from the REAL vertex + trivial frag ---
  {
    const trivial = `#version 300 es
precision highp float;
out vec4 outColor;
void main() { outColor = vec4(1.0, 0.0, 0.0, 1.0); }`;
    const p2 = gl.createProgram();
    gl.attachShader(p2, compile(gl.VERTEX_SHADER, SHADERS.vert));
    gl.attachShader(p2, compile(gl.FRAGMENT_SHADER, trivial));
    gl.linkProgram(p2);
    log("trivial link:", gl.getProgramParameter(p2, gl.LINK_STATUS));
    gl.useProgram(p2);
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.clearColor(0,0,1,1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    const t = new Uint8Array(4);
    gl.readPixels(5,5,1,1,gl.RGBA,gl.UNSIGNED_BYTE,t);
    log("BISECT trivial-frag readback:", Array.from(t), "expect 255,0,0,255");
  }

}
</script> </body></html>
