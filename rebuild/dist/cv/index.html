</p> <div class="cvlist">  <h2 class="cvlisttitle">Recent positions</h2> <div class="cvlistitem"> <div class="timetag">2020 – present</div> <div class="position">Data analyst | Team lead</div> <div class="company">The State Treasury of Finland</div> <div class="description"> <p>Leading the data analytics team at the State Treasury in a role between practise and management.</p> <ul> <li>Proactively identifying and addressing potential cases for data analysis</li><li>Leading visual analytics, data visualization and data product/ux design competencies</li><li>Supporting in data engineering/analytics development related technical tasks</li><li>Responsible for client communications with the government ministries</li><li>Developing and designing custom visualizations in react/d3/highcharts and standard based dashboards in PowerBI</li><li>Developing the iterative modes of work within the team (Scrum-inspired)</li><li>Championing applied design thinking in client work (iterative define -> ideate -> prototype -> deliver -phases)</li> </ul> </div> <div class="caption">Clients: Government ministries of Finland</div> </div><div class="cvlistitem"> <div class="timetag">2017 – 2020</div> <div class="position">Designer ∨ Developer</div> <div class="company">Frantic</div> <div class="description"> <p>Working as a designer/developer in both consulting and project roles in a digital agency setting.</p> <ul> <li>UI Design of multiple projects in several fields, ranging from mobile apps to process management software</li><li>UX/Interaction design through prototyping and an iterative process - primarily high fidelity interactive prototypes (UXPin, InVision, Sketch, Figma, Framer etc)</li><li>UX/Product design research experience, designing surveys and interviews, developing prototypes, running workshops</li><li>Developing web based apps in PHP/JavaScript, ranging from high-definition prototypes to production ready components (Wordpress, React, Vue.js, vanilla js)</li><li>Responsible for client communication and project management in consultancy roles</li><li>Developing my ability to learn and adapt very quickly into different roles, teams, requirements and sets of users</li> </ul> </div> <div class="caption">Clients: SOK, Kemira, Pihlajalinna, Posti, VTV</div> </div><div class="cvlistitem"> <div class="timetag">2015 – 2017</div> <div class="position">Development specialist (part-time)</div> <div class="company">STT</div> <div class="description"> <p>Continued but separate contract working part-time during further university studies, with main responsibility over an internal analytics tool project and news robotics tests.</p> <ul> <li>End-to-end ownership of design and development for a unique news throughput analytics service from co-developed concept to finalized product prototype</li><li>Iterative process of building prototypes and experimental designs in code, testing, gathering feedback and forming insights into new features</li><li>Visual/User interface design in Adobe tools</li><li>Building tools for explorative visual analysis with visualization tools like Google Charts, Highcharts, d3</li><li>Collaboration with data providers, custom API-integrations</li><li>Front-end development in JavaScript (Ember), back-end in heroku (node.js)</li><li>Building prototypes of news robots for automatic text production</li><li>Handover of final prototype to production, that would later go on to receive <a href="https://stt.fi/stt-tarkkailija-dni-rahoitus/">Google Digital News Initiative funding (in Finnish)</a></li> </ul> </div>  </div><div class="cvlistitem"> <div class="timetag">2014 – 2015</div> <div class="position">Digital service developer/designer</div> <div class="company">STT</div> <div class="description"> <p>Research, development and design of new visualization based tools and products for STT media service clients.</p> <ul> <li>Responsible for UX/UI and code implementation of data visualization tools</li><li>Working in a small, agile R&D-type team, designing and developing experimental products</li><li>Data visualization with tools like QGis, Mapbox, Leaflet, jQuery, custom javascript</li> </ul> </div> <div class="caption">Clients: Iltalehti, KSML, Apu, Veikkaus</div> </div><div class="cvlistitem"> <div class="timetag">2013 – 2014</div> <div class="position">Data journalist, interactive graphic designer</div> <div class="company">STT</div> <div class="description"> <p>From internship to thesis project to full-time position. Pioneering projects of digital journalism and online data visualization as the first employee of the STT data newsdesk.</p> <ul> <li>Designing interactive news graphics with a focus on data visualization</li><li>Working together with other journalists to identify interesting topics or points of view through data</li><li>Synthesizing and visualizing complex topics to make them accessible to readers</li> </ul> </div>  </div> </div><div class="cvlist">  <h2 class="cvlisttitle">Education</h2> <div class="cvlistitem"> <div class="timetag">2015 - 2019</div> <div class="position">MA in New Media Design and Production</div> <div class="company">Aalto University School of Arts, Design and Architecture</div> <div class="description"> <p>Graduated as Master of Arts from the Aalto Media Lab. Studies in a wide range of creative topics, with a focus on user interfaces, data visualization and design research.</p>  </div>  </div><div class="cvlistitem"> <div class="timetag">2013 – 2013</div> <div class="position">Erasmus exchange</div> <div class="company">Glasgow Caledonian University</div> <div class="description"> <p>Exchange studies at the Graphic Design for Digital Media program on courses focusing on user-centered design tools and methods, user interface and user experience design.</p>  </div>  </div><div class="cvlistitem"> <div class="timetag">2011 - 2015</div> <div class="position">BEng. in Media Technology</div> <div class="company">Metropolia University of Applied Sciences</div> <div class="description"> <p>Graduated with a Bachelor of Engineering degree in Media Technology, with a specialisation in digital media and content production. Heavy on practical web development, with a side of design methods, 3d-graphics and printing production.</p>  </div>  </div><div class="cvlistitem"> <div class="timetag">2008 - 2011</div> <div class="position">(uncompleted) B.Sci. in Computer Science</div> <div class="company">University of Helsinki</div> <div class="description"> <p>Studies in computer science, mathematics and (most importantly) cognitive science and philosophy, that set me off a different path leading to the abandonment of the pursuit of this degree.</p>  </div>  </div> </div><div class="cvlist">  <h2 class="cvlisttitle">Other more/less relevant skills</h2> <div class="cvlistitem"> <div class="timetag"></div> <div class="position"></div> <div class="company"></div> <div class="description"> <p></p> <ul> <li>I am adept at several digital design tools, like Sketch, Figma &amp; Adobe Suite and always interested to add more of these into my skillset, taking pride in being quick to adapt and learn.</li><li>I am familiar with different design methodologies and very interested in the theory behind them. I particularly enjoy building prototypes, conducting user interviews, surveys, fieldwork and applying quantitative analytical skills to design and design skills to quantitative analysis.</li><li>I am a proficient front-end web developer, experienced in building software with javascript based tools such as React, Vue and Angular. When needed, diving into the back-end is not unfamiliar with applied experience in node.js and PHP.</li><li>I am fluent in Finnish, Swedish and English at a native level (both written and oral), with a Cambridge Professional English-certificate to vouch for the third one.</li><li>In my free time I enjoy making art in different mediums, taking (mediocre) photographs, traveling to learn about different cultures, reading both fact and fiction, and the freedom of bicycling, running or hiking.</li> </ul> </div>  </div> </div> <button class="btn btn--solid print-button" onclick="window.print()"> <span role="img" aria-label="print icon">🖨</span> Print
